<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS SYSTEM - SC_ MALIKOV</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #00e5ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-transform: uppercase;
        }

        /* HUD (Head-Up Display) qatlamlari */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            border: 2px solid rgba(0, 229, 255, 0.1);
            box-sizing: border-box;
            z-index: 10;
        }

        .header {
            position: absolute;
            top: 20px;
            left: 30px;
            letter-spacing: 3px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 300;
            text-shadow: 0 0 10px #00e5ff;
        }

        .brand {
            color: #ff0055;
            font-weight: bold;
        }

        .status-box {
            position: absolute;
            bottom: 30px;
            right: 30px;
            text-align: right;
            font-size: 12px;
            line-height: 1.5;
        }

        .scanner {
            position: absolute;
            top: 50%;
            left: 30px;
            transform: translateY(-50%);
            font-size: 10px;
            color: rgba(0, 229, 255, 0.5);
        }

        /* Ovoz to'lqini vizualizatsiyasi uchun joy */
        #visualizer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .bar {
            width: 3px;
            background: #00e5ff;
            box-shadow: 0 0 5px #00e5ff;
            transition: height 0.1s;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <div class="header">
            <h1>JARVIS <span class="brand">SC_ MALIKOV</span></h1>
            <div id="date-time">SYSTEM ONLINE...</div>
        </div>

        <div class="scanner">
            CORE_TEMP: 42°C<br>
            NEURAL_LINK: STABLE<br>
            XAUUSD_ANALYSIS: WAITING...<br>
            SMC_ZONE: MITIGATED
        </div>

        <div class="status-box">
            PROTOCOL: PARADOX JARVIS ZERO<br>
            LOCATION: TASHKENT, UZ<br>
            ENCRYPTION: AES-256
        </div>

        <div id="visualizer">
            </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // 1. SAHNA SOZLAMALARI
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 2. NEON GLOW (BLOOM) EFFEKTI
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5, // Bloom kuchi
            0.4, // Radius
            0.85 // Threshold
        );
        
        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // 3. JARVIS HALQALARI (GEOMETRIYA)
        const ringGroup = new THREE.Group();
        scene.add(ringGroup);

        const createRing = (radius, tube, color, rotationSpeed) => {
            const geometry = new THREE.TorusGeometry(radius, tube, 16, 100);
            const material = new THREE.MeshBasicMaterial({ 
                color: color, 
                wireframe: true,
                transparent: true,
                opacity: 0.6
            });
            const ring = new THREE.Mesh(geometry, material);
            ring.userData = { speed: rotationSpeed };
            return ring;
        };

        // Turli xil halqalar qo'shish
        const ring1 = createRing(8, 0.02, 0x00e5ff, 0.01);
        const ring2 = createRing(10, 0.05, 0x0088ff, -0.005);
        const ring3 = createRing(12, 0.01, 0xff0055, 0.02);
        
        ring2.rotation.x = Math.PI / 2;
        ring3.rotation.y = Math.PI / 4;

        ringGroup.add(ring1, ring2, ring3);

        // Markaziy gologramma nuqtasi
        const coreGeo = new THREE.IcosahedronGeometry(1, 1);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true });
        const core = new THREE.Mesh(coreGeo, coreMat);
        scene.add(core);

        camera.position.z = 25;

        // 4. DINAMIK INTERFEYS ELEMENTLARI
        const visualizer = document.getElementById('visualizer');
        for (let i = 0; i < 20; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.height = '10px';
            visualizer.appendChild(bar);
        }

        const updateVisualizer = () => {
            const bars = document.querySelectorAll('.bar');
            bars.forEach(bar => {
                const height = Math.random() * 40 + 5;
                bar.style.height = `${height}px`;
            });
        };

        // 5. ANIMATSIYA TSIKLI
        function animate() {
            requestAnimationFrame(animate);

            // Halqalarni aylantirish
            ring1.rotation.z += ring1.userData.speed;
            ring2.rotation.x += ring2.userData.speed;
            ring3.rotation.y += ring3.userData.speed;
            
            core.rotation.y += 0.02;

            // Vizualizatorni yangilash
            if (Math.random() > 0.8) updateVisualizer();

            // Oddiy renderer o'rniga composer ishlatiladi (Bloom uchun)
            composer.render();
        }

        // Oynani o'zgartirganda moslashish
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

        // Vaqtni yangilab turish
        setInterval(() => {
            const now = new Date();
            document.getElementById('date-time').innerText = now.toLocaleString();
        }, 1000);

    </script>
</body>
</html>
