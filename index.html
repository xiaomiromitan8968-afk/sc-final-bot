<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mening Oilam</title>
    <!-- Tailwind CSS (Dizayn uchun) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome (Ikonkalar uchun) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Umumiy sozlamalar va shriftlar */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #050505;
            color: #ffffff;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        /* --- 1-Bo'lim: Chiziqli ranglar animatsiyasi (Gradient Background) --- */
        .gradient-bg {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientAnim 15s ease infinite;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease-out, visibility 1s ease-out;
        }

        @keyframes gradientAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Neon Tugma (Mening Oilam) */
        .neon-button {
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            background: transparent;
            border: 2px solid #00ffff;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 10px #00ffff, inset 0 0 10px #00ffff;
            text-shadow: 0 0 5px #00ffff;
            transition: all 0.3s ease;
            outline: none;
        }

        .neon-button:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff, 0 0 80px #00ffff;
        }

        /* --- Ilova ekranlari uchun umumiy yashirish/ko'rsatish mantiqi --- */
        .screen {
            display: none;
            min-height: 100vh;
            width: 100%;
            padding: 20px;
            animation: fadeIn 1s ease forwards;
            position: relative;
            z-index: 5;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Menyu Tugmalari (2-Bo'lim) --- */
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 400px;
            margin: 0 auto;
            padding-top: 50px;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            font-size: 20px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .menu-btn:hover::before {
            left: 100%;
        }

.menu-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border-color: #ff00ff; /* Hoverda neon pushti */
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
        }

        .family-btn {
            margin-top: 40px;
            border-color: #00ffff;
            color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }
        
        .family-btn:hover {
            border-color: #00ffff;
            color: #000;
            background: #00ffff;
            box-shadow: 0 0 20px #00ffff;
            text-shadow: none;
        }

        /* --- Profil Ekranlari --- */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            z-index: 100;
            transition: color 0.3s;
        }
        .back-btn:hover { color: #ff00ff; }

        .profile-image {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            margin: 40px auto 20px;
            display: block;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .bio-text {
            max-width: 600px;
            margin: 0 auto;
            text-align: justify;
            line-height: 1.8;
            color: #ccc;
            padding: 20px;
            font-size: 16px;
        }

        /* Dadam uchun qo'shimcha rasmlar animatsiyasi */
        .extra-photos-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 50px;
            padding-bottom: 50px;
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.8s ease-out;
        }

        .extra-photos-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .extra-photo {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid #555;
            transition: transform 0.3s;
        }
        .extra-photo:hover { transform: scale(1.1); }
        
        /* Mobil uchun rasm o'lchami */
        @media (min-width: 768px) {
            .extra-photo { width: 150px; height: 150px; }
            .profile-image { width: 250px; height: 250px; }
        }

        /* --- Umumiy Galereya Animatsiyasi --- */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding: 20px;
            max-width: 800px;
            margin: 60px auto 0;
        }

        .gallery-item {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            object-fit: cover;
            opacity: 0;
            transform: scale(0.8);
            animation: popIn 0.5s ease forwards;
        }

        @keyframes popIn {
            to { opacity: 1; transform: scale(1); }
        }

        /* --- Rasm Modal (Kattalashtirish) --- */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .image-modal.active {
            display: flex;
            opacity: 1;
        }

.modal-content {
            max-width: 95vw;
            max-height: 90vh;
            border-radius: 15px;
            object-fit: contain;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.4);
            transform: scale(0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Sakrash (bounce) effekti */
        }

        .image-modal.active .modal-content {
            transform: scale(1);
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10000;
        }

        .close-modal:hover {
            color: #ff00ff;
            transform: scale(1.2);
        }

        /* Barcha rasmlarni bosish mumkin qilib ko'rsatish */
        .profile-image, .extra-photo, .gallery-item {
            cursor: pointer;
        }

    </style>
</head>
<body>

    <!-- YASHIRIN MUSIQA FAYLI (Placeholder url, brauzer ruxsat so'rashi mumkin) -->
    <!-- Xavfsizlik va ruxsatlar sababli bu yerda jimjitlik emas, sokin musiqa ssilkasi qo'yilgan -->
    <audio id="bgMusic" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=ambient-piano-amp-strings-10711.mp3" type="audio/mpeg">
    </audio>

    <!-- 1. DASTLABKI EKRAN (Intro) -->
    <div id="introScreen" class="gradient-bg">
        <button class="neon-button" onclick="startApp()">Mening Oilam</button>
    </div>

    <!-- 2. ASOSIY MENYU -->
    <div id="menuScreen" class="screen">
        <h1 class="text-3xl md:text-5xl text-center mt-10 mb-8 font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600">
            Oilam A'zolari
        </h1>
        <div class="menu-container">
            <button class="menu-btn" onclick="openProfile('dadam')">Dadam</button>
            <button class="menu-btn" onclick="openProfile('oyim')">Oyim</button>
            <button class="menu-btn" onclick="openProfile('akam')">Akam</button>
            <button class="menu-btn" onclick="openProfile('opam')">Opam</button>
            <button class="menu-btn" onclick="openProfile('men')">Men</button>
            
            <button class="menu-btn family-btn" onclick="openGallery()">Mening Oilam</button>
        </div>
    </div>

    <!-- 3. PROFIL EKRANI (Dinamik o'zgaradi) -->
    <div id="profileScreen" class="screen">
        <button class="back-btn" onclick="goBackToMenu()"><i class="fa-solid fa-arrow-left"></i></button>
        
        <!-- Dinamik Ma'lumotlar shu yerga tushadi -->
        <h2 id="profileName" class="text-3xl text-center mt-12 font-bold text-white tracking-wider">Ism</h2>
        
        <img id="profileMainImg" src="" alt="Profile" class="profile-image fallback-img">
        
        <div id="profileBio" class="bio-text">
            Avtobiografiya shu yerda bo'ladi...
        </div>

<!-- DADAM UCHUN QO'SHIMCHA RASMLAR (Boshqalar uchun yashiriladi) -->
        <div id="dadExtraPhotos" class="extra-photos-container">
            <!-- Rasmlar internetdan olingan placeholderlar -->
            <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=200&h=200&fit=crop" class="extra-photo fallback-img" alt="Dad Extra 1" onclick="openImageModal(this.src)">
            <img src="https://images.unsplash.com/photo-1542317148-8b4efcecb6cb?w=200&h=200&fit=crop" class="extra-photo fallback-img" alt="Dad Extra 2" onclick="openImageModal(this.src)">
            <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=200&h=200&fit=crop" class="extra-photo fallback-img" alt="Dad Extra 3" onclick="openImageModal(this.src)">
        </div>
        
        <!-- Pastga tushishni bildirish uchun belgi (faqat dadamda ko'rinadi) -->
        <div id="scrollHint" class="text-center mt-10 mb-20 text-gray-500 animate-bounce hidden">
            <i class="fa-solid fa-chevron-down text-2xl"></i><br>
            <span class="text-sm">Pastga suring</span>
        </div>
    </div>

    <!-- 4. UMUMIY GALEREYA EKRANI -->
    <div id="galleryScreen" class="screen">
         <button class="back-btn" onclick="goBackToMenu()"><i class="fa-solid fa-arrow-left"></i></button>
         <h2 class="text-3xl text-center mt-12 font-bold text-[#00ffff] tracking-wider mb-8">Oilaviy Xotiralar</h2>
         
         <div class="gallery-container" id="galleryGrid">
            <!-- JavaScript orqali animatsiya bilan qo'shiladi -->
         </div>
    </div>

    <!-- 5. KATTALASHTIRILGAN RASM EKRANI (Modal) -->
    <div id="imageModal" class="image-modal" onclick="closeImageModal(event)">
        <span class="close-modal" onclick="closeImageModal(event)"><i class="fa-solid fa-xmark"></i></span>
        <img id="modalImg" class="modal-content" src="">
    </div>

    <script>
        // --- MA'LUMOTLAR BAZASI (O'zgartirishingiz mumkin) ---
        const familyData = {
            dadam: {
                name: "Dadam",
                image: "rasim1.jpg",
                bio: "Dadam — oilamizning ustuni va eng mehribon inson. U kishi o'z hayotini bizning farovonligimiz uchun baxshida qilganlar. Yoshliklaridan mehnatkash bo'lib, o'z kasbining ustasi hisoblanadilar. Bo'sh vaqtlarida kitob o'qishni va tabiat qo'ynida dam olishni yoqtiradilar. Dadamning pand-nasihatlari doim bizga to'g'ri yo'l ko'rsatadi. U kishi bilan o'tkazgan har bir daqiqa biz uchun qadrli."
            },
            oyim: {
                name: "Oyim",
                image: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=400&h=400&fit=crop",
                bio: "Oyim — uydagi farishta. Ularning mehri va pishirgan ovqatlari butun oilani birlashtiradi. Har doim ochiq ko'ngil, hammaga yordam berishga tayyor turadilar. Oyimning sabri va tushunishi oilamizdagi tinchlikning asosiy garovidir."
            },
            akam: {
                name: "Akam",
                image: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400&h=400&fit=crop",
                bio: "Akam — mening eng yaqin do'stim va himoyachim. Maqsad sari intiluvchan, doim yangilikka o'ch inson. Bolaligimizdan birga katta bo'lganmiz, juda ko'p qiziqarli voqealarni birga boshdan kechirganmiz. U hozirda o'z karyerasini qurish bilan band."
            },
            opam: {
                name: "Opam",
                image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&h=400&fit=crop",
                bio: "Opam — juda aqlli va mehribon. Har doim maslahat kerak bo'lganda birinchi bo'lib opamga murojaat qilaman. Ularning didi juda nozik va go'zallikni qadrlaydilar. Oila davrasini har doim o'zining kulgisi bilan bezatadi."
            },
            men: {
                name: "Men",
                image: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=400&h=400&fit=crop",

bio: "Men ushbu mo'jazgina ilova yaratuvchisi va shu ajoyib oilaning a'zosiman. Texnologiyalar, dasturlash va ijod qilishga qiziqaman. Eng katta boyligim — bu mening oilam. Shu sababli bu mitti xotira ilovasini yaratishga qaror qildim."
            }
        };

        const galleryImages = [
            "https://images.unsplash.com/photo-1511895426328-dc8714191300?w=300&h=300&fit=crop",
            "https://images.unsplash.com/photo-1581952971540-84c483a9ce42?w=300&h=300&fit=crop",
            "https://images.unsplash.com/photo-1506869640319-fea1a2ab8e40?w=300&h=300&fit=crop",
            "https://images.unsplash.com/photo-1501139083538-0139583c060f?w=300&h=300&fit=crop",
            "https://images.unsplash.com/photo-1542037104857-ffbb0b9155fb?w=300&h=300&fit=crop",
            "https://images.unsplash.com/photo-1609220136736-443140cffec6?w=300&h=300&fit=crop"
        ];

        // --- ASOSIY FUNKSIYALAR ---

        function startApp() {
            // 1. Musiqani boshlash
            const bgMusic = document.getElementById('bgMusic');
            bgMusic.volume = 0.5; // Ovoz balandligini pasaytirish (past ovoz)
            bgMusic.play().catch(e => console.log("Brauzer avtomatik musiqani chekladi: ", e));

            // 2. Intro ekranni yo'qotish
            const intro = document.getElementById('introScreen');
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.visibility = 'hidden';
                intro.style.display = 'none'; // DOMdan olib tashlash
                // 3. Menyuni ko'rsatish
                document.getElementById('menuScreen').classList.add('active');
            }, 1000);
        }

        function goBackToMenu() {
            // Barcha ekranlarni yopish
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            // Menyuni ochish
            document.getElementById('menuScreen').classList.add('active');
            
            // Dadamning animatsiyasini reset qilish
            document.getElementById('dadExtraPhotos').classList.remove('visible');
            window.removeEventListener('scroll', checkScroll);
        }

        // SCROLL KUZATUVCHISI (Faqat Dadam uchun)
        function checkScroll() {
            const extraPhotos = document.getElementById('dadExtraPhotos');
            // Agar sahifa oxiriga yaqinlashsak
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 150) {
                extraPhotos.classList.add('visible');
            }
        }

        function openProfile(memberKey) {
            const data = familyData[memberKey];
            if(!data) return;

            // Menyuni yopish
            document.getElementById('menuScreen').classList.remove('active');
            
            // Ma'lumotlarni to'ldirish
            document.getElementById('profileName').innerText = data.name;
            
            const mainImg = document.getElementById('profileMainImg');
            mainImg.src = data.image;
            // Asosiy rasmni bosganda kattalashadigan qilish
            mainImg.onclick = function() { openImageModal(data.image); };
            
            document.getElementById('profileBio').innerText = data.bio;

            const extraPhotosContainer = document.getElementById('dadExtraPhotos');
            const scrollHint = document.getElementById('scrollHint');

// Agar tanlangan kishi "dadam" bo'lsa
            if (memberKey === 'dadam') {
                extraPhotosContainer.style.display = 'flex';
                extraPhotosContainer.classList.remove('visible'); // Boshida ko'rinmas
                scrollHint.classList.remove('hidden'); // Surish belgisini ko'rsatish
                
                // Scroll hodisasini quloq solish
                window.addEventListener('scroll', checkScroll);
                // Sahifa tepasiga qaytarish
                window.scrollTo(0, 0);
            } else {
                // Boshqalar uchun yashirish
                extraPhotosContainer.style.display = 'none';
                scrollHint.classList.add('hidden');
                window.removeEventListener('scroll', checkScroll);
                window.scrollTo(0, 0);
            }

            // Profil ekranni ochish
            document.getElementById('profileScreen').classList.add('active');
        }

        function openGallery() {
            document.getElementById('menuScreen').classList.remove('active');
            const galleryGrid = document.getElementById('galleryGrid');
            galleryGrid.innerHTML = ''; // Tozalash

            // Galereya ekranni ochish
            document.getElementById('galleryScreen').classList.add('active');
            window.scrollTo(0, 0);

            // Rasmlarni ketma-ket animatsiya bilan qo'shish
            galleryImages.forEach((src, index) => {
                setTimeout(() => {
                    const img = document.createElement('img');
                    img.src = src;
                    img.className = 'gallery-item fallback-img';
                    img.alt = 'Oilaviy Rasm ' + (index + 1);
                    // Galereyadagi ra
