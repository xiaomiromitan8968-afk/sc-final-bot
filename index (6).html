<style>
:root{--bg:#070d22;--bg2:#0b1534;--card:rgba(20,31,72,.72);--card2:rgba(38,56,120,.38);--ink:#eef2ff;--muted:#8fa0c8;--line:rgba(130,160,255,.2);--blue:#2563eb;--violet:#885cfa;--green:#10b981;--teal:#14b8a6;--red:#f43f5e;--amber:#f59e0b;--grad:linear-gradient(135deg,#7c5cf7,#2563eb);--prog:linear-gradient(90deg,#2563eb,#14b8a6);--sh:0 10px 34px rgba(2,6,23,.45);--r:18px;--okbg:rgba(16,185,129,.14);--badbg:rgba(244,63,94,.14);--hl:rgba(37,99,235,.2);color-scheme:dark}
:root[data-theme=light]{--bg:#eef3ff;--bg2:#e2eaff;--card:rgba(255,255,255,.9);--card2:#e8efff;--ink:#0f172a;--muted:#55678f;--line:rgba(37,99,235,.18);--sh:0 10px 30px rgba(37,60,130,.12);--hl:rgba(37,99,235,.1);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{min-height:100vh;color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;background:radial-gradient(900px 480px at 85% -8%,rgba(124,92,247,.28),transparent 70%),radial-gradient(800px 480px at -10% 8%,rgba(37,99,235,.24),transparent 70%),var(--bg);background-attachment:fixed;padding-bottom:84px;transition:background-color .25s,color .25s}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
a{color:inherit;text-decoration:none}
svg{flex:none}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;height:62px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.22rem;letter-spacing:-.02em}
.logo .mark{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px rgba(124,92,247,.5)}
.sp{flex:1}
.dnav{display:none;gap:4px}
.dnav a{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:12px;color:var(--muted);font-weight:600;font-size:.94rem}
.dnav a.on,.dnav a:hover{color:var(--ink);background:var(--hl)}
.ibtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;transition:border-color .2s,transform .12s}
.ibtn:hover{border-color:var(--blue)}
.avatar{background:var(--grad);color:#fff;font-weight:800;border:0}
nav.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav.bnav a{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;padding:6px 0;border-radius:14px;color:var(--muted);font-size:.72rem;font-weight:600}
nav.bnav a.on{color:#7ea6ff;background:var(--hl)}
:root[data-theme=light] nav.bnav a.on{color:var(--blue)}
main{padding:20px 0 24px;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.glass{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pad{padding:18px}
.muted{color:var(--muted)}.small{font-size:.86rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:14px;padding:13px 20px;font-weight:700;color:#fff;background:var(--grad);box-shadow:0 8px 22px rgba(79,70,229,.35);transition:transform .12s,opacity .2s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled,.btn[aria-disabled=true]{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:var(--card2);border:1px solid var(--line);box-shadow:none;color:var(--ink)}
.btn.ok{background:linear-gradient(135deg,#059669,#10b981)}
.btn.danger{background:linear-gradient(135deg,#e11d48,#f43f5e)}
.btn.block{width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hero{position:relative;overflow:hidden}
.hero h1{font-size:clamp(1.35rem,4.4vw,2rem);letter-spacing:-.02em;color:#fff;max-width:420px}
.hero .quote{display:flex;gap:8px;align-items:flex-start;margin-top:14px;color:#dbe5ff;font-style:italic;max-width:300px;font-size:.95rem}
.hero .quote svg{color:#34d399;margin-top:3px}
.hero .owl{position:absolute;right:10px;bottom:6px;width:150px;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
.hero .mtn{position:absolute;left:0;right:0;bottom:0;width:100%;height:70px;pointer-events:none}
.hero .txt{position:relative;z-index:2;max-width:calc(100% - 120px)}
.stats{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:14px 8px}
.stat{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:0 4px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat .t{font-size:.72rem;color:var(--muted);line-height:1.2}
.stat b{display:block;font-size:1.02rem;color:var(--ink);line-height:1.25}
.stat .gi{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.gi.blue{background:var(--hl);color:#7ea6ff}.gi.amber{background:rgba(245,158,11,.16);color:#fbbf24}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring span{position:absolute;font-weight:800;font-size:.9rem}
.sec{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 12px}
.sec h2{font-size:1.15rem}
.sec a{color:#7ea6ff;font-size:.85rem;display:flex;align-items:center;gap:4px;font-weight:600}
.grid{display:grid;gap:12px}
.bgrid{grid-template-columns:repeat(2,1fr)}
.bk{display:flex;flex-direction:column;gap:8px;padding:14px;text-align:left;width:100%;transition:transform .15s,border-color .2s;color:var(--ink)}
button.bk:hover,a.bk:hover{transform:translateY(-3px);border-color:var(--blue)}
.bk.now{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal),var(--sh)}
.bk.off{opacity:.7}
.bico{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;display:grid;place-items:center}
.bk.off .bico{background:var(--card2);color:var(--muted)}
.bk h3{font-size:1.02rem}
.bk .pill{margin-top:auto;text-align:center;font-size:.8rem;font-weight:700;padding:8px;border-radius:10px;background:var(--card2);color:var(--muted)}
.bk .pill.go{background:var(--blue);color:#fff}
.bar{height:8px;border-radius:99px;background:rgba(130,160,255,.18);overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px;background:var(--prog);transition:width .35s}
.back{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back h1{font-size:1.1rem}
.back .ibtn{border-radius:12px}
.bhead{display:flex;align-items:center;gap:14px;padding:16px}
.bhead .bico{width:50px;height:50px;border-radius:14px}
.ugrid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 8px;justify-items:center;padding:20px 10px}
.uc{width:56px;height:56px;border-radius:50%;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:1.08rem;line-height:1;background:rgba(100,116,139,.28);color:var(--muted);transition:transform .15s;position:relative}
button.uc:not(:disabled):hover{transform:scale(1.08)}
.uc:disabled{cursor:not-allowed}
.uc svg{margin-top:3px}
.uc.done{background:linear-gradient(135deg,#059669,#10b981);color:#fff}
.uc.cur{background:var(--hl);border-color:#3b82f6;color:var(--ink);box-shadow:0 0 0 4px rgba(59,130,246,.2)}
.uc.none{background:transparent;border:2px dashed var(--line)}
.uc .ck{position:absolute;right:-3px;top:-3px;width:18px;height:18px;border-radius:50%;background:#fff;color:#059669;display:grid;place-items:center}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;padding:0 12px 16px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.top3{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.top3 .ctr{margin-left:auto;font-weight:800}
.lw{max-width:640px;margin:0 auto}
.wcard{padding:26px 18px 0;text-align:center;overflow:hidden}
.en{font-size:clamp(2.2rem,10vw,3.3rem);font-weight:800;letter-spacing:-.02em;word-break:break-word;line-height:1.1}
.spk{margin:14px auto 0;width:46px;height:46px;border-radius:50%;border:0;background:var(--hl);color:#7ea6ff;display:grid;place-items:center}
.spk:hover{background:var(--blue);color:#fff}
.def{margin:14px auto 0;max-width:460px;color:var(--muted);font-size:.95rem}
.uz{margin:16px auto 0;display:inline-block;font-size:clamp(1.4rem,6vw,1.9rem);font-weight:800;padding:8px 20px;border-radius:14px;background:var(--okbg);color:#34d399;animation:fade .25s}
.rv{font-size:.78rem;color:var(--amber);margin-top:8px}
.reveal{margin:22px -18px 0;width:calc(100% + 36px);border:0;border-top:1px solid var(--line);background:var(--hl);color:#9dbbff;padding:15px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700}
:root[data-theme=light] .reveal{color:var(--blue)}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tip{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--card2);border:1px solid var(--line);color:var(--muted);font-size:.9rem}
.tip svg{color:#fbbf24;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;background:var(--hl);border:1px solid var(--line);font-size:.8rem;font-weight:700;color:#9dbbff}
:root[data-theme=light] .chip{color:var(--blue)}
.qw{font-size:clamp(2rem,9vw,2.8rem);font-weight:800;margin:12px 0 4px;word-break:break-word;letter-spacing:-.02em}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:600;transition:border-color .15s,background .15s}
.opt .lt{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.82rem;color:var(--muted);flex:none}
.opt .st{margin-left:auto;display:none}
.opt:not(:disabled):hover{border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--hl)}
.opt.right{border-color:var(--green);background:var(--okbg)}
.opt.right .lt{border-color:var(--green);color:var(--green)}
.opt.right .st{display:grid;color:#fff;background:var(--green);width:24px;height:24px;border-radius:50%;place-items:center}
.opt.wrong{border-color:var(--red);background:var(--badbg)}
.opt.wrong .lt{border-color:var(--red);color:var(--red)}
.opt.wrong .st{display:grid;color:#fff;background:var(--red);width:24px;height:24px;border-radius:50%;place-items:center}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px 16px;border-radius:14px;border:1px solid}
.fb.ok{background:var(--okbg);border-color:var(--green)}
.fb.bad{background:var(--badbg);border-color:var(--red)}
.fb .ico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.fb.ok .ico{background:var(--green)}.fb.bad .ico{background:var(--red)}
.fb b{display:block}
.res{text-align:center;padding:26px 18px}
.res h2{font-size:1.9rem;margin:6px 0 4px}
.res .ringw{margin:18px auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.cell{display:flex;align-items:center;gap:10px;text-align:left;padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.cell .t{font-size:.76rem;color:var(--muted)}.cell b{font-size:1.2rem;display:block;line-height:1.2}
.cell .gi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.gi.g{background:var(--okbg);color:#34d399}.gi.r{background:var(--badbg);color:#fb7185}
.mist{list-style:none;padding:0;margin:14px 0 0;text-align:left}
.mist li{padding:9px 0;border-top:1px solid var(--line);font-size:.92rem}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:14px;background:var(--card2);margin:14px 0;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;border-radius:10px;padding:10px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--blue);color:#fff}
.urow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line)}
.urow:first-child{border-top:0}
.urow .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:rgba(100,116,139,.3);color:var(--muted);flex:none}
.urow.done .n{background:var(--green);color:#fff}.urow.cur .n{background:var(--blue);color:#fff}
.urow .s{margin-left:auto;font-size:.8rem;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.urow.done .s{color:#34d399}.urow.cur .s{color:#7ea6ff}
button.urow:not(:disabled):hover{background:var(--hl)}
.urow:disabled{cursor:not-allowed;opacity:.7}
.tiles{grid-template-columns:repeat(2,1fr)}
.tile{padding:14px;display:flex;align-items:center;gap:12px}
.tile b{font-size:1.3rem;display:block;line-height:1.1}
.set{padding:6px}
.setr{display:flex;align-items:center;gap:14px;padding:15px 12px;width:100%;background:transparent;border:0;border-top:1px solid var(--line);text-align:left}
.setr:first-child{border-top:0}
.setr .si{width:34px;height:34px;border-radius:50%;background:var(--hl);color:#7ea6ff;display:grid;place-items:center;flex:none}
.setr .v{margin-left:auto;color:var(--muted);display:flex;align-items:center;gap:6px}
button.setr:hover{background:var(--hl);border-radius:12px}
.tg{width:48px;height:28px;border-radius:99px;border:0;background:rgba(100,116,139,.5);position:relative;transition:background .2s;flex:none}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.tg[aria-checked=true]{background:var(--blue)}.tg[aria-checked=true]:after{transform:translateX(20px)}
input.txt{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:140px;text-align:right}
.note{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--hl);border:1px solid var(--line);color:var(--muted);font-size:.9rem}
.note svg{color:#7ea6ff;margin-top:2px}
.acts{display:grid;gap:12px}
.act{display:flex;align-items:center;gap:14px;padding:16px}
.act .bico{flex:none}
.act .gi2{flex:1;min-width:0}
.act h3{font-size:1rem;margin-bottom:4px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.74rem;font-weight:700;background:rgba(100,116,139,.28);color:var(--muted)}
.badge.ok{background:var(--okbg);color:#34d399}
.badge.warn{background:rgba(245,158,11,.16);color:#fbbf24}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.wchip{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:.88rem}
.wchip em{font-style:normal;color:var(--muted)}
details>summary{cursor:pointer;font-weight:700;padding:4px 0}
table.list{width:100%;border-collapse:collapse}
table.list td{padding:8px 4px;border-top:1px solid var(--line)}
table.list td:last-child{text-align:right;color:#34d399;font-weight:600}
.banner{border-radius:14px;padding:12px 16px;background:rgba(245,158,11,.14);color:#fbbf24;margin-bottom:14px;border:1px solid rgba(245,158,11,.4)}
.banner.err{background:var(--badbg);color:#fb7185;border-color:var(--red)}
pre{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;font-size:.8rem}
.modal{position:fixed;inset:0;background:rgba(3,7,22,.65);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:18px}
.modal .glass{max-width:420px;width:100%;background:var(--bg2);padding:22px}
.modal h3{margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:90vw;text-align:center;font-weight:600}
#toast.on{opacity:1;transform:translateX(-50%)}
footer{padding:8px 0 24px;color:var(--muted);font-size:.8rem;text-align:center}
@media(min-width:720px){
  body{padding-bottom:0}
  nav.bnav{display:none}
  .dnav{display:flex;margin-left:14px}
  .bgrid{grid-template-columns:repeat(3,1fr)}
  .hero{min-height:330px;padding:32px}
  .hero .owl{width:210px;right:34px}
  .hero .txt{max-width:55%}
  .hero h1{font-size:2rem}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .acts{grid-template-columns:1fr 1fr}
  .ugrid{grid-template-columns:repeat(10,1fr);padding:26px}
  #toast{bottom:28px}
  .stat b{font-size:1.15rem}
  .stat{flex-direction:row;text-align:left;gap:10px;padding:0 8px}
}
@media(min-width:1000px){.bgrid{grid-template-columns:repeat(6,1fr)}.bk{padding:12px}}
@media(max-width:380px){.hero .txt{max-width:100%}.hero .owl{width:100px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== 3D "toy" dizayn ===== */
:root{--bg:#1a1240;--bg2:#241a5c;--card:#2c2174;--card2:#3a2d8c;--ink:#fff8ee;--muted:#b9aeef;--line:rgba(255,255,255,.13);--blue:#3aa0ff;--violet:#8b5cff;--green:#2fdc9a;--teal:#27d3e6;--red:#ff5a78;--amber:#ffc531;--yel:#ffd84d;--edge:rgba(8,4,32,.72);--grad:linear-gradient(180deg,#b58cff,#7b46f5);--prog:linear-gradient(90deg,#ffc531,#ff5a78);--sh:0 14px 26px rgba(0,0,0,.32);--r:22px;--hl:rgba(255,216,77,.16);--okbg:rgba(47,220,154,.16);--badbg:rgba(255,90,120,.16)}
:root[data-theme=light]{--bg:#efeaff;--bg2:#fff;--card:#fff;--card2:#ece5ff;--ink:#241a5c;--muted:#6a5fa8;--line:rgba(36,26,92,.14);--edge:rgba(110,90,200,.35);--sh:0 14px 24px rgba(70,50,150,.16);--hl:rgba(123,70,245,.12)}
html{font-size:clamp(14px,.5vw + 12.5px,18px)}
body{font:800 1rem/1.5 Nunito,ui-rounded,system-ui,"Segoe UI",sans-serif;font-weight:700;background:radial-gradient(70vw 50vh at 90% -5%,rgba(255,79,139,.3),transparent 70%),radial-gradient(70vw 50vh at -10% 10%,rgba(58,160,255,.25),transparent 70%),var(--bg);padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1240px;padding:0 clamp(12px,3vw,28px)}

svg{filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.ibtn{width:44px;height:44px;border-radius:15px;border:0;background:linear-gradient(180deg,var(--card2),var(--card));box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 4px 0 var(--edge);color:var(--yel)}

.ibtn.avatar{overflow:hidden;padding:0;border-radius:50%;background:var(--grad);color:#fff;font-weight:900;border:3px solid var(--yel);box-shadow:0 4px 0 #c27a00}
.avatar img,.pav img{width:100%;height:100%;object-fit:cover;display:block}
nav.bnav{left:50%;right:auto;transform:translateX(-50%);width:min(580px,calc(100% - 20px));bottom:calc(10px + env(safe-area-inset-bottom,0px) + var(--tg-safe-area-inset-bottom,0px));padding:8px;border-radius:28px;border:2px solid var(--line);background:color-mix(in srgb,var(--bg2) 94%,transparent);box-shadow:0 6px 0 var(--edge),0 20px 34px rgba(0,0,0,.4)}
nav.bnav a{padding:8px 0;border-radius:20px;font-size:.7rem;font-weight:900;transition:transform .15s}
nav.bnav a.on,.dnav a.on{color:#4a2a00;background:linear-gradient(180deg,#ffe27a,#ffb21f);box-shadow:inset 0 2px 0 #fff9,0 4px 0 #c27a00;transform:translateY(-5px)}
.dnav a{border-radius:16px;font-weight:900}.dnav a:hover{background:var(--hl);color:var(--ink)}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 60%),var(--card);border:2px solid var(--line);border-radius:var(--r);box-shadow:inset 0 2px 0 rgba(255,255,255,.14),0 6px 0 var(--edge),var(--sh);backdrop-filter:none}

h1,h2,h3{font-weight:900;letter-spacing:-.01em}
.btn{border-radius:18px;padding:14px 22px;font-weight:900;background:var(--grad);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 5px 0 #3f1fa8,0 12px 18px rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 1px 0 #3f1fa8}
.btn.ghost{background:linear-gradient(180deg,var(--card2),var(--card));box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 5px 0 var(--edge)}
.btn.ok{background:linear-gradient(180deg,#52f0b4,#1fbf82);color:#033d29;box-shadow:inset 0 2px 0 #fff8,0 5px 0 #0c7a52}
.btn.danger{background:linear-gradient(180deg,#ff8aa0,#f0365a);box-shadow:inset 0 2px 0 #fff6,0 5px 0 #9b1432}
.btn:disabled,.btn[aria-disabled=true]{background:var(--card2);color:var(--muted);box-shadow:0 4px 0 var(--edge);opacity:.7}
.hero{border-radius:32px;padding:clamp(20px,4vw,40px);display:grid;gap:12px;align-items:center;min-height:0;border:0;background:radial-gradient(110% 90% at 100% 0,#ff9a5c,transparent 55%),linear-gradient(150deg,#ff4f8b,#8b4dff 70%,#5b3df0);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 8px 0 #3b1a9a,0 24px 36px rgba(0,0,0,.4)}
.hero .txt{max-width:none;position:relative;z-index:2}
.hero h1{font-size:clamp(1.5rem,5.2vw,2.6rem);line-height:1.12;max-width:16em;text-shadow:0 3px 0 rgba(60,20,140,.55)}
.hero .quote{max-width:none;color:#fff;font-weight:800;font-style:normal}.hero .quote svg{color:var(--yel)}
.hero .scene{position:relative;height:clamp(130px,30vw,210px)}
.hero .owl{position:absolute;right:0;bottom:-4px;width:clamp(110px,26vw,190px);filter:drop-shadow(0 10px 0 rgba(40,10,110,.35)) drop-shadow(0 18px 16px rgba(0,0,0,.35))}
.blk{position:absolute;display:grid;place-items:center;width:clamp(46px,12vw,74px);aspect-ratio:1;border-radius:18px;font-style:normal;font-weight:900;font-size:clamp(1.5rem,5vw,2.5rem);color:#5a2fd0;background:linear-gradient(160deg,#fff,#e8dcff);box-shadow:3px 3px 0 #c9b4ff,6px 6px 0 #9a78f0,9px 9px 0 #7b55dc,14px 18px 22px rgba(0,0,0,.35)}
.b1{left:2%;bottom:12%;transform:rotate(-12deg)}.b2{left:21%;bottom:38%;transform:rotate(8deg);color:#ff4f8b}.b3{left:40%;bottom:8%;transform:rotate(-4deg);color:#1fbf82}

.stats{background:none;border:0;box-shadow:none;padding:0;gap:10px;margin-top:22px}
.stat,.stat+.stat{border:2px solid var(--line);border-radius:20px;padding:14px 6px;background:linear-gradient(180deg,var(--card2),var(--card));box-shadow:inset 0 2px 0 rgba(255,255,255,.14),0 5px 0 var(--edge)}
.stat b{font-size:1.1rem;font-weight:900}
.gi,.bico,.si,.spk{color:#fff;border-radius:15px;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 4px 0 rgba(0,0,0,.35),0 8px 10px rgba(0,0,0,.25)}
.gi.blue,.bico,.si,.spk{background:linear-gradient(160deg,#6fd0ff,#2f6bff);box-shadow:inset 0 2px 0 #fff8,0 4px 0 #1a3fa8,0 8px 10px rgba(0,0,0,.25);color:#fff}
.gi.amber{background:linear-gradient(160deg,#ffe27a,#ff9a1f);box-shadow:inset 0 2px 0 #fff8,0 4px 0 #b25e00;color:#fff}

.spk:hover{background:linear-gradient(160deg,#ffe27a,#ff9a1f);color:#fff}.spk:active{transform:translateY(3px)}
.bgrid{grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.bgrid>:nth-child(6n+2) .bico{background:linear-gradient(160deg,#ff9fb4,#f0365a);box-shadow:inset 0 2px 0 #fff8,0 4px 0 #9b1432}
.bgrid>:nth-child(6n+3) .bico{background:linear-gradient(160deg,#52f0b4,#1fbf82);box-shadow:inset 0 2px 0 #fff8,0 4px 0 #0c7a52}
.bgrid>:nth-child(6n+4) .bico{background:linear-gradient(160deg,#ffe27a,#ff9a1f);box-shadow:inset 0 2px 0 #fff8,0 4px 0 #b25e00}
.bgrid>:nth-child(6n+5) .bico{background:linear-gradient(160deg,#c9a8ff,#7b46f5);box-shadow:inset 0 2px 0 #fff8,0 4px 0 #3f1fa8}
.bgrid>:nth-child(6n+6) .bico{background:linear-gradient(160deg,#7af0ff,#16a9c4);box-shadow:inset 0 2px 0 #fff8,0 4px 0 #0a6679}
.bk.off .bico{background:var(--card2);box-shadow:0 4px 0 var(--edge);color:var(--muted)}
.bico{width:44px;height:44px;border-radius:15px}
.bk{padding:16px}button.bk:hover,a.bk:hover{transform:translateY(-4px) rotate(-.6deg);border-color:var(--yel)}
.bk.now{border-color:var(--yel);box-shadow:inset 0 2px 0 rgba(255,255,255,.14),0 6px 0 #c27a00,var(--sh)}
.bk .pill{border-radius:13px;font-weight:900;box-shadow:0 3px 0 var(--edge)}.bk .pill.go{background:var(--grad);box-shadow:inset 0 2px 0 #fff6,0 3px 0 #3f1fa8}
.bar{height:12px;background:rgba(0,0,0,.28);box-shadow:inset 0 2px 3px rgba(0,0,0,.4)}

.sec h2{font-size:1.3rem}.sec a{color:var(--yel);font-weight:900}
.ugrid{grid-template-columns:repeat(auto-fill,minmax(62px,1fr))}
.uc{width:58px;height:58px;border:0;font-weight:900;background:linear-gradient(180deg,#4a3d9a,#35287c);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 5px 0 var(--edge);color:var(--muted)}

.reveal{border-top:0;background:linear-gradient(180deg,#ffe27a,#ffb21f);color:#4a2a00;font-weight:900;box-shadow:inset 0 2px 0 #fff9}
.chip{background:var(--hl);color:var(--yel);font-weight:900;border-radius:14px}
:root[data-theme=light] .chip{color:#7b46f5}
.opt{border:2px solid var(--line);border-radius:18px;font-weight:800;background:linear-gradient(180deg,var(--card2),var(--card));box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 5px 0 var(--edge);transition:transform .08s,box-shadow .08s}

.tabs{border-radius:18px;box-shadow:inset 0 3px 5px rgba(0,0,0,.3)}.tabs button{border-radius:13px;font-weight:900}
.tabs button.on{background:var(--grad);box-shadow:inset 0 2px 0 #fff6,0 3px 0 #3f1fa8}

.setr .si{width:38px;height:38px}.setr .v{font-weight:800}

.note svg,.tip svg{color:var(--yel)}.note,.tip{border-radius:18px;font-weight:700}
input.txt{border-radius:13px;font-weight:800}
.profile{display:flex;flex-wrap:wrap;align-items:center;gap:18px;padding:20px;margin-bottom:16px}
.pav{width:92px;height:92px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:2.4rem;font-weight:900;color:#fff;background:var(--grad);border:5px solid var(--yel);box-shadow:0 6px 0 #c27a00,0 14px 22px rgba(0,0,0,.35);flex:none}
.pinfo{flex:1;min-width:210px;display:grid;gap:10px}.pinfo b{font-size:1.3rem;font-weight:900}
.profile .btn{padding:10px 16px}
.modal .glass{background:var(--bg2)}
#toast{border-radius:16px;font-weight:900;box-shadow:0 4px 0 var(--edge)}
@media(min-width:720px){body{padding-bottom:28px}.stat{flex-direction:row}}
@media(max-width:360px){.ibtn{width:40px;height:40px}.logo{font-size:1.1rem}}
.opt,.btn,.uc,.ibtn,nav.bnav a{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.opt:disabled{opacity:1}

function nav(hash){if(location.hash===hash)render();else location.hash=hash;}

function render(){
